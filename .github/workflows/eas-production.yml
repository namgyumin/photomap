name: EAS Android Production Build

on:
  workflow_dispatch:

jobs:
  build:
    name: EAS Production (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Detect EAS project
        id: eas_project
        run: |
          if node -e "const c=require('./app.json').expo || {}; process.exit(c.extra?.eas?.projectId ? 0 : 1)"; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "EAS project is not configured yet; skipping Android production build. Run 'eas init' and commit app.json extra.eas.projectId to enable this workflow."
          fi

      - name: Build Android production AAB
        if: steps.eas_project.outputs.configured == 'true'
        run: eas build --platform android --profile production --non-interactive
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
